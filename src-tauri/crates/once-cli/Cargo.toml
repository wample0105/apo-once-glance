[package]
name = "once-cli"
version = "0.1.1"
description = "定影 Onceglance CLI（once 命令）"
edition = "2021"

[[bin]]
name = "once"
path = "src/main.rs"

[dependencies]
once-core = { path = "../once-core" }
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"
