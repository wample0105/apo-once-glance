[package]
name = "once-core"
version = "0.1.1"
description = "定影 Onceglance 内核：捕获 / OCR / 标注 / 落盘 / 历史"
edition = "2021"

[dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Ole",
  "Win32_Security",
  "Foundation",
  "Foundation_Numerics",
  "Globalization",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
rand = "0.9"
tiny-skia = "0.12"
ttf-parser = "0.25"
dirs = "6"
