[workspace]
members = ["crates/once-core", "crates/once-cli"]
resolver = "2"

[package]
name = "onceglance"
version = "0.1.1"
description = "定影 Onceglance · AI 原生截图工具（Agent 视觉层）"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "onceglance"
path = "src/main.rs"

[lib]
name = "onceglance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once-core = { path = "crates/once-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
sha2 = "0.10"
rfd = "0.15"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm",
      "Win32_Graphics_Gdi", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
