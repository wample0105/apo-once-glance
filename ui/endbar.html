<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>长截图</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  html, body { background: var(--ov-surface, #1e1e1e); overflow: hidden; height: 100vh; display: flex; }
  .bar {
    display: flex; align-items: center; gap: 8px;
    flex: 1;
    background: var(--ov-surface);
    border: 1px solid var(--ov-border);
    border-radius: var(--r-tool);
    color: var(--ov-fg);
    padding: 0 12px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
    white-space: nowrap;
    animation: fadein 0.15s ease-out;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #dim {
    font-size: 14px; font-weight: 600; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .sep { width: 1px; height: 20px; background: var(--ov-border); }
  .btn {
    border: none; background: var(--ov-surface-2, #2c2c2e); color: var(--ov-fg);
    padding: 6px 8px; border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:hover { background: #3a3a3c; }
  .btn.primary { background: var(--accent); color: #fff; font-weight: 500; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn-x {
    border: none; background: transparent; color: var(--ov-fg-dim);
    padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  .btn-x:hover { color: var(--ov-fg); background: var(--ov-surface-2, #2c2c2e); }
</style>
</head>
<body role="status" aria-live="polite">
  <div class="bar">
    <span id="dim">-- x --</span>
    <span class="sep"></span>
    <button class="btn primary" id="save" title="保存为 PNG 文件（Enter）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v13M7 3v5h8"/></svg></button>
    <button class="btn" id="pin" title="贴图：钉到桌面，原位贴出（长图自动适配屏高）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="17" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg></button>
    <button class="btn" id="copy" title="复制长图到剪贴板"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
    <button class="btn-x" id="x" title="取消（Esc）">✕</button>
  </div>
  <script src="js/endbar.js"></script>
</body>
</html>
