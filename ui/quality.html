<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>长截图接缝质检</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  body { background: var(--bg-primary); display: flex; flex-direction: column; height: 100vh; font-size: 12.5px; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  header .t { font-size: 14px; font-weight: 500; }
  header .sub { color: var(--text-tertiary); font-size: 11.5px; }
  header .sp { flex: 1; }
  main { flex: 1; display: flex; min-height: 0; }
  #preview {
    flex: 1; overflow: auto; background: var(--bg-tertiary);
    display: flex; flex-direction: column; gap: 0; padding: 16px;
  }
  #preview img { width: 100%; display: block; }
  .seamline { position: relative; height: 0; border-top: 2px dashed var(--stitch-low); }
  .seamline.cur { border-top: 2px solid var(--accent); }
  aside {
    width: 320px; flex: none; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  aside .head { padding: 12px 14px 8px; }
  aside .list { flex: 1; overflow: auto; padding: 0 10px 10px; }
  .seamitem {
    border: 1px solid var(--border); border-radius: var(--r-card);
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .seamitem.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
  .seamitem .tt { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .ctrls { display: flex; gap: 6px; }
  .ctrls button {
    border: 1px solid var(--border); background: #fff; border-radius: 6px;
    padding: 4px 10px; cursor: pointer; font-family: var(--mono); font-size: 11.5px;
  }
  .ctrls button:hover { background: var(--bg-tertiary); }
  .ctrls button.acc { flex: 1; font-family: inherit; }
  footer {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 16px; border-top: 1px solid var(--border);
    color: var(--text-tertiary); font-size: 11.5px;
  }
  footer .sp { flex: 1; }
</style>
</head>
<body>
  <header>
    <span class="t" id="title">接缝质检</span>
    <span class="sub" id="sub"></span>
    <span class="sp"></span>
    <button class="btn" id="accept-all">全部接受</button>
    <button class="btn primary" id="save">确认并保存 <span class="kbd">Ctrl+↵</span></button>
  </header>
  <main>
    <div id="preview"></div>
    <aside>
      <div class="head">
        <div style="font-weight:500" id="list-title"></div>
        <div class="sub" style="color:var(--text-tertiary);font-size:11px;margin-top:2px">
          键盘：↑↓ 切换接缝 · J/K 微调 −1/+1 · Ctrl+↵ 保存
        </div>
      </div>
      <div class="list" id="seam-list"></div>
    </aside>
  </main>
  <footer>
    <span id="meminfo">接缝修正会实时应用到预览</span>
    <span class="sp"></span>
    <span id="segments-ctl"></span>
  </footer>
  <script src="js/quality.js"></script>
</body>
</html>
