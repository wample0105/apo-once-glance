<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>定影取景</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/annotate.css">
<style>
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    cursor: crosshair;
    user-select: none;
  }
  /* 冻结画面：整屏位图（所见即所得），放大镜/取色都从它取样 */
  #freeze {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: none; z-index: 1;
  }
  body.frozen #freeze { display: block; }

  /* 遮罩：选区外压暗（拖拽中 55% / 未选 30%） */
  #stage { position: absolute; inset: 0; z-index: 2; }
  #stage.dim-idle { /* 业界同款探测态：无遮罩 + 普通箭头光标（探测先行） */ }
  #stage.cross { cursor: crosshair; }
  body.dragging, body.dragging * { cursor: crosshair !important; } /* 仅拖拽画选区时是十字 */

  /* 识别高亮（窗口/控件） */
  #det {
    position: absolute; display: none; z-index: 3;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); /* 识别区域外压暗 = 自动吸附高亮 */
    pointer-events: none;
  }
  #det .tag {
    position: absolute; top: -20px; left: 0;
    background: var(--accent); color: #fff;
    font: 10.5px/1.6 var(--ui); padding: 0 6px;
    border-radius: 4px 4px 0 0; white-space: nowrap;
    max-width: 260px; overflow: hidden; text-overflow: ellipsis;
  }

  /* 选区框：业界同款 8 手柄 */
  #sel {
    position: absolute; display: none; z-index: 4;
    border: 2.5px solid var(--accent);
  }
  .handle {
    position: absolute; width: 10px; height: 10px;
    background: #fff; border: 1.5px solid var(--accent);
    border-radius: 50%; display: none; z-index: 6;
  }
  .handle::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; }
  body.selected .handle { display: block; }
  .handle.nw { left: -6px; top: -6px; cursor: nwse-resize; }
  .handle.ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .handle.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
  .handle.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .handle.n { left: 50%; top: -6px; margin-left: -5px; cursor: ns-resize; }
  .handle.s { left: 50%; bottom: -6px; margin-left: -5px; cursor: ns-resize; }
  .handle.w { left: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
  .handle.e { right: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
  #sel.hole { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); }
  body.dragging #sel.hole { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); }
  /* 移动整框时的光标 */
  #sel.moveable { cursor: move; }

  /* 尺寸牌：业界同款常显（左上角黑底等宽） */
  #sizechip {
    position: absolute; display: none; z-index: 7;
    background: rgba(0, 0, 0, 0.75); color: #fff;
    font: 12px/1.5 var(--mono); padding: 2px 8px;
    border-radius: 4px; white-space: nowrap;
  }

  /* 放大镜 */
  #magnifier {
    position: absolute; display: none; z-index: 8;
    border: 1.5px solid var(--ov-border); border-radius: 6px;
    overflow: hidden; background: #000;
    pointer-events: none; /* 只读展示，绝不拦截框选/画图 */
  }
  #magnifier canvas { display: block; }
  #magnifier .meta {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.78); color: #fff;
    font: 10.5px/1.6 var(--mono); padding: 1px 6px;
    display: flex; justify-content: space-between;
  }
  #magnifier .cross-h, #magnifier .cross-v { position: absolute; background: rgba(255,255,255,0.85); }
  #magnifier .cross-h { left: 0; right: 0; height: 1px; }
  #magnifier .cross-v { top: 0; bottom: 0; width: 1px; }

  /* Esc 提示 */
  #cancelhint {
    position: absolute; top: 16px; left: 50%;
    transform: translateX(-50%);
    background: var(--ov-surface); color: var(--ov-fg);
    font-size: 12px; padding: 6px 14px;
    border-radius: 8px; border: 1px solid var(--ov-border);
    opacity: 0.92; z-index: 9;
  }

  /* 长截图模式：只能拖上下边 */
  body[data-kind="scroll"] #stage { cursor: row-resize; }

  /* ===== 两行工具栏（业界同款，贴选区边沿） ===== */
  #toolbar {
    position: absolute; display: none; z-index: 20;
    background: var(--ov-surface);
    border: 1px solid var(--ov-border); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    padding: 4px; flex-direction: column; gap: 2px;
    cursor: default;
  }
  #toolbar .row { display: flex; align-items: center; gap: 2px; }
  #toolbar .tb {
    border: none; background: transparent; color: var(--ov-fg);
    min-width: 32px; height: 30px; border-radius: 6px; cursor: pointer;
    font-size: 12px; padding: 0 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  }
  #toolbar .tb:hover { background: rgba(255, 255, 255, 0.09); }
  #toolbar .tb.on { background: var(--accent); color: #fff; }
  #toolbar .tb.pri { background: var(--accent); color: #fff; font-weight: 500; }
  #toolbar .tb.pri:hover { background: var(--accent-hover); }
  #toolbar .tb .kbd { font-family: var(--mono); font-size: 9.5px; opacity: 0.75; }
  #toolbar .sep { width: 1px; height: 18px; background: var(--ov-border); margin: 0 3px; }
  #toolbar .sw {
    width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; padding: 0;
  }
  #toolbar .sw.on { border-color: #fff; }
  #toolbar .sw.custom {
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    color: #fff; font-size: 11px; line-height: 1;
  }
  #toolbar .sw.custom.on { border-color: #fff; }
  #pr-hex {
    width: 74px; height: 22px; font: 11px/1.4 var(--mono);
    background: var(--ov-surface-2); color: var(--ov-fg);
    border: 1px solid var(--ov-border); border-radius: 5px; padding: 0 6px;
    display: none;
  }
  #pr-text select {
    height: 22px; font-size: 11px; background: var(--ov-surface-2);
    color: var(--ov-fg); border: 1px solid var(--ov-border); border-radius: 5px;
  }
  #pr-num-start { font-size: 11px; color: var(--ov-fg-dim); }
  #pr-num-start input {
    width: 44px; height: 22px; font: 11px/1.4 var(--mono);
    background: var(--ov-surface-2); color: var(--ov-fg);
    border: 1px solid var(--ov-border); border-radius: 5px; padding: 0 4px;
  }
  #toolbar .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ov-fg); border: none; cursor: pointer; padding: 0; }
  #toolbar .dot.on { background: var(--accent); }
  #toolbar .seg { display: inline-flex; }
  #toolbar .seg button {
    font-family: inherit; font-size: 11px; padding: 4px 9px; cursor: pointer;
    background: var(--ov-surface-2); border: 1px solid var(--ov-border); color: #cfcfd6;
  }
  #toolbar .seg button + button { border-left: none; }
  #toolbar .seg button:first-child { border-radius: 6px 0 0 6px; }
  #toolbar .seg button:last-child { border-radius: 0 6px 6px 0; }
  #toolbar .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #toolbar .props { display: none; align-items: center; gap: 6px; padding: 2px 6px; color: var(--ov-fg-dim); font-size: 11px; }
  #toolbar .props.on { display: inline-flex; }
  #toolbar .tip { color: var(--ov-fg-dim); font-size: 11px; padding: 0 4px; }

  /* 画图层（选区内标注对象） */
  #layer { position: absolute; display: none; z-index: 5; pointer-events: none; }
  #layer .obj { position: absolute; pointer-events: none; }
  #layer.tool-eraser .obj { pointer-events: auto; cursor: pointer; }
  #layer.tool-eraser .obj:hover { filter: brightness(1.25) drop-shadow(0 0 3px rgba(255,255,255,0.8)); }
  .txtedit {
    position: absolute; z-index: 40; min-width: 40px;
    outline: 2px solid var(--accent); background: rgba(0,0,0,0.24);
    color: #fff; padding: 2px 6px; border-radius: 4px;
    font-weight: 500; white-space: pre-wrap; cursor: text;
  }
  .ann-toast {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ov-surface); color: var(--ov-fg); font-size: 12px;
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--ov-border);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4); z-index: 95;
  }
</style>
</head>
<body data-kind="region">
  <img id="freeze" alt="">
  <div id="stage" class="dim-idle cross"></div>
  <div id="det"><span class="tag"></span></div>
  <div id="sel" class="hole">
    <div class="handle nw"></div><div class="handle n"></div><div class="handle ne"></div>
    <div class="handle w"></div><div class="handle e"></div>
    <div class="handle sw"></div><div class="handle s"></div><div class="handle se"></div>
  </div>
  <div id="layer"></div>
  <div id="sizechip"></div>
  <div id="magnifier">
    <canvas id="magcv" width="148" height="148"></canvas>
    <div class="cross-h"></div><div class="cross-v"></div>
    <div class="meta"><span id="mag-xy">0,0</span><span id="mag-hex">#FFFFFF</span></div>
  </div>

  <div id="toolbar">
    <div class="row" id="tb-main">
      <button class="tb pri" id="tb-copy" title="复制图片（Enter / Ctrl+C）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span class="kbd">Enter</span></button>
      <span class="sep"></span>
      <button class="tb" data-tool="arrow" title="箭头 A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M9 5h10v10"/></svg></button>
      <button class="tb" data-tool="pen" title="画笔 P"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></button>
      <button class="tb" data-tool="marker" title="荧光笔 H"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l6 6"/><path d="M4 20h16"/><path d="M14 4l6 6-9 9H5v-6z"/></svg></button>
      <button class="tb" data-tool="rect" title="矩形 R"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button class="tb" data-tool="ellipse" title="椭圆 O"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="tb" data-tool="text" title="文字 T"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5h14M12 5v14"/></svg></button>
      <button class="tb" data-tool="num" title="序号 N"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M10 8.5a1.8 1.8 0 1 1 3.4.9c-.4 1-3.4 2.4-3.4 4.6h4" stroke-linecap="round"/></svg></button>
      <button class="tb" data-tool="mosaic" title="马赛克 M"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="7" height="7" opacity=".9"/><rect x="13" y="4" width="7" height="7" opacity=".45"/><rect x="4" y="13" width="7" height="7" opacity=".45"/><rect x="13" y="13" width="7" height="7" opacity=".9"/></svg></button>
      <button class="tb" data-tool="eraser" title="橡皮擦 E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8.5l-5-5a2 2 0 0 1 0-2.8L13 3a2 2 0 0 1 2.8 0l5.2 5.2a2 2 0 0 1 0 2.8L13 19"/><path d="M7 9l8 8"/></svg></button>
      <span class="sep"></span>
      <button class="tb" id="tb-undo" title="撤销 Ctrl+Z"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></button>
      <button class="tb" id="tb-redo" title="重做 Ctrl+Shift+Z"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg></button>
      <span class="sep"></span>
      <button class="tb" id="tb-ocr" title="取字：本地 OCR，文字进剪贴板"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9h8M12 9v7M9.5 16h5"/></svg></button>
      <button class="tb" id="tb-scroll" title="长截图：滚动采集拼接"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="1.5"/><path d="M10 7h4M10 11h4"/></svg></button>
      <button class="tb" id="tb-pin" title="贴图：钉在桌面置顶显示"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5l4.5 4.5-2.3 2.3.6 4-3.3-1.5-4.9 4.9L8 17.3l4.6-4.6-1.4-3.2 3.8-4z"/></svg></button>
      <button class="tb" id="tb-save" title="保存到 Pictures\Onceglance（Ctrl+S）"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v13M7 3v5h8"/></svg></button>
      <button class="tb" id="tb-exit" title="取消（Esc）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    </div>
    <div class="row" id="tb-props">
      <span class="props on" id="pr-color"></span>
      <span class="props" id="pr-width">
        <select id="pr-width-sel">
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="6" selected>6</option>
          <option value="9">9</option>
          <option value="14">14</option>
        </select>
      </span>
      <span class="props" id="pr-arrow">
        <select id="pr-arrow-style">
          <option value="end" selected>箭头 →</option>
          <option value="both">双箭头 ↔</option>
          <option value="start">反向 ←</option>
          <option value="none">无箭头 —</option>
        </select>
        <select id="pr-arrow-line">
          <option value="solid" selected>实线</option>
          <option value="dashed">虚线</option>
          <option value="dotted">点线</option>
        </select>
      </span>
      <span class="props" id="pr-shape">
        <span class="seg" id="pr-fill">
          <button data-f="outline" class="on">描边</button><button data-f="fill">填充</button><button data-f="outline_fill">描+填</button>
        </span>
        <span class="seg" id="pr-round"><button data-r="0" class="on">直角</button><button data-r="1">圆角</button></span>
        <span class="seg" id="pr-dash"><button data-dash="0" class="on">实线</button><button data-dash="1">虚线</button></span>
        <select id="pr-opacity">
          <option value="1" selected>不透明</option>
          <option value="0.75">75%</option>
          <option value="0.5">50%</option>
        </select>
      </span>
      <span class="props" id="pr-text">
        <select id="pr-font">
          <option value="default">微软雅黑</option>
          <option value="simsun">宋体</option>
          <option value="simhei">黑体</option>
          <option value="kaiti">楷体</option>
          <option value="segoe">Segoe UI</option>
        </select>
        <select id="pr-tsize">
          <option value="14">14</option>
          <option value="18">18</option>
          <option value="22" selected>22</option>
          <option value="28">28</option>
          <option value="36">36</option>
          <option value="48">48</option>
        </select>
        <span class="seg" id="pr-tstyle"><button data-t="bold"><b>B</b></button><button data-t="italic"><i>I</i></button><button data-t="underline"><u>U</u></button></span>
        <span class="seg" id="pr-talign"><button data-a="left" class="on">左</button><button data-a="center">中</button><button data-a="right">右</button></span>
        <select id="pr-tlh">
          <option value="1" selected>行距 1.0</option>
          <option value="1.4">行距 1.4</option>
          <option value="1.8">行距 1.8</option>
        </select>
        <span class="seg" id="pr-tbg"><button data-bg="0" class="on">背景</button></span>
      </span>
      <span class="props" id="pr-num">
        <span class="seg" id="pr-num-style"><button data-ns="solid" class="on">实心</button><button data-ns="outline">描边</button><button data-ns="plain">数字</button></span>
        <select id="pr-num-size">
          <option value="24">小</option>
          <option value="32" selected>中</option>
          <option value="44">大</option>
        </select>
        <span class="numstart" id="pr-num-start">起始 <input id="num-start" type="number" value="1" min="0" max="999" /></span>
      </span>
      <span class="props" id="pr-mos">
        <span class="seg" id="pr-mos-mode"><button data-mm="mosaic" class="on">马赛克</button><button data-mm="blur">模糊</button></span>
        <span class="seg" id="pr-mos-strong"><button data-m="8">轻</button><button data-m="14" class="on">中</button><button data-m="20">重</button></span>
      </span>
      <span class="tip" id="pr-tip"></span>
    </div>
  </div>

  <div id="cancelhint">拖动框选，或单击自动识别的窗口 · Tab 切换候选<button id="cancel-x" title="退出截图（Esc）">✕ 退出</button></div>
  <style>
    #cancel-x {
      font-family: inherit; font-size: 11px; line-height: 1.5;
      margin-left: 10px; padding: 1px 10px;
      border: 1px solid var(--ov-border); border-radius: 6px;
      background: var(--ov-surface-2); color: var(--ov-fg);
      cursor: pointer;
    }
    #cancel-x:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
  <script src="js/overlay.js"></script>
  <script src="js/annotate.js"></script>
</body>
</html>
