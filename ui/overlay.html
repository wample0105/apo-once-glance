<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>定影取景</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/annotate.css">
<style>
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    cursor: crosshair;
    user-select: none;
  }
  /* 冻结画面：整屏位图（所见即所得），放大镜/取色都从它取样。
     实测 pixelated 在 DPI 非整除下产生行列重复错位（残差 2.6%→4.0%），保持默认双线性 */
  #freeze {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: none; z-index: 1;
  }
  body.frozen #freeze { display: block; }

  /* 遮罩：选区外压暗（拖拽中 55% / 未选 30%） */
  #stage { position: absolute; inset: 0; z-index: 2; }
  #stage.dim-idle { /* 业界同款探测态：无遮罩 + 普通箭头光标（探测先行） */ }
  #stage.cross { cursor: crosshair; }
  body.dragging, body.dragging * { cursor: crosshair !important; } /* 仅拖拽画选区时是十字 */

  /* 识别高亮（窗口/控件） */
  #det {
    position: absolute; display: none; z-index: 3;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); /* 识别区域外压暗 = 自动吸附高亮 */
    pointer-events: none;
  }
  #det .tag {
    position: absolute; top: -20px; left: 0;
    background: var(--accent); color: #fff;
    font: 10.5px/1.6 var(--ui); padding: 0 6px;
    border-radius: 4px 4px 0 0; white-space: nowrap;
    max-width: 260px; overflow: hidden; text-overflow: ellipsis;
  }

  /* 选区框：业界同款 8 手柄 */
  #sel {
    position: absolute; display: none; z-index: 4;
    border: 2.5px solid var(--accent);
  }
  .handle {
    position: absolute; width: 10px; height: 10px;
    background: #fff; border: 1.5px solid var(--accent);
    border-radius: 50%; display: none; z-index: 6;
  }
  .handle::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; }
  body.selected .handle { display: block; }
  /* 对象编辑态：隐藏选区自己的手柄（只显示一层对象锚点，业界同款） */
  body.obj-selected .handle { display: none !important; }
  .handle.nw { left: -6px; top: -6px; cursor: nwse-resize; }
  .handle.ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .handle.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
  .handle.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .handle.n { left: 50%; top: -6px; margin-left: -5px; cursor: ns-resize; }
  .handle.s { left: 50%; bottom: -6px; margin-left: -5px; cursor: ns-resize; }
  .handle.w { left: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
  .handle.e { right: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
  #sel.hole { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); }
  body.dragging #sel.hole { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); }
  /* ===== 长截图采集模式（业界同款）：蒙版/工具栏等全隐，只留选区外扩边框；
     窗口整体滚轮穿透由 Rust 侧 WS_EX_TRANSPARENT 完成，下层页面直接可见可滚。
     边框画在选区外沿（inset:-4px），采集矩形内全透明 → BitBlt 拼接段零污染 ===== */
  body.ls-mode #sel.hole { box-shadow: none; }
  body.ls-mode #sel { border-color: transparent; }
  body.ls-mode #sel::after {
    content: ""; position: absolute; inset: -5px;
    border: 2px solid var(--accent); border-radius: 6px; pointer-events: none;
  }
  body.ls-mode #sel .handle, body.ls-mode #det, body.ls-mode #sizechip,
  body.ls-mode #magnifier, body.ls-mode #toolbar, body.ls-mode #statusbar,
  body.ls-mode #objsel, body.ls-mode #layer, body.ls-mode #escdlg,
  body.ls-mode #pr-text-menu { display: none !important; }
  /* 移动整框时的光标 */
  #sel.moveable { cursor: move; }

  /* 尺寸牌：业界同款常显（左上角黑底等宽） */
  #sizechip {
    position: absolute; display: none; z-index: 7;
    background: rgba(0, 0, 0, 0.75); color: #fff;
    font: 12px/1.5 var(--mono); padding: 2px 8px;
    border-radius: 4px; white-space: nowrap;
  }

  /* 放大镜 */
  #magnifier {
    position: absolute; display: none; z-index: 8;
    border: 1.5px solid var(--ov-border); border-radius: 6px;
    overflow: hidden; background: #000;
    pointer-events: none; /* 只读展示，绝不拦截框选/画图 */
  }
  #magnifier canvas { display: block; }
  #magnifier .meta {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.78); color: #fff;
    font: 10.5px/1.6 var(--mono); padding: 1px 6px;
    display: flex; justify-content: space-between;
  }
  #magnifier .cross-h, #magnifier .cross-v { position: absolute; background: rgba(255,255,255,0.85); }
  #magnifier .cross-h { left: 0; right: 0; height: 1px; }
  #magnifier .cross-v { top: 0; bottom: 0; width: 1px; }

  /* Esc 提示：冻结完成（body.frozen）后才显示——
     BitBlt(CAPTUREBLT) 会拍进覆盖层自己的分层窗口，UI 先行显示会造成"双层" */
  body:not(.frozen) #cancelhint { display: none; }
  #cancelhint {
    position: absolute; top: 16px; left: 50%;
    transform: translateX(-50%);
    background: var(--ov-surface); color: var(--ov-fg);
    font-size: 12px; padding: 6px 14px;
    border-radius: 8px; border: 1px solid var(--ov-border);
    opacity: 0.92; z-index: 9;
  }

  /* 长截图模式：只能拖上下边 */
  body[data-kind="scroll"] #stage { cursor: row-resize; }

  /* ===== 两行工具栏（业界同款，贴选区边沿） ===== */
  #toolbar {
    position: absolute; display: none; z-index: 20;
    background: var(--ov-surface);
    border: 1px solid var(--ov-border); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    padding: 4px; flex-direction: column; gap: 2px;
    cursor: default;
  }
  #toolbar .row { display: flex; align-items: center; gap: 2px; }
  /* 左侧拖动把手（同类产品/Material drag indicator ⋮⋮ 点阵）：拖动自由摆放；本次截图会话内有效 */
  #tb-handle {
    position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 40px; display: flex; align-items: center; justify-content: center;
    border-radius: 5px; cursor: grab; z-index: 2;
    -webkit-user-select: none; user-select: none;
  }
  #tb-handle svg { fill: rgba(255,255,255,0.55); }
  #tb-handle:hover { background-color: rgba(255,255,255,0.10); }
  #tb-handle:hover svg { fill: rgba(255,255,255,0.95); }
  #tb-handle.dragging { cursor: grabbing; background-color: rgba(255,255,255,0.16); }
  #toolbar { padding-left: 16px; }
  #toolbar .tb {
    border: none; background: transparent; color: var(--ov-fg);
    min-width: 32px; height: 30px; border-radius: 6px; cursor: pointer;
    font-size: 12px; padding: 0 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  }
  #toolbar .tb:hover { background: rgba(255, 255, 255, 0.09); }
  #toolbar .tb { position: relative; }
  /* 同款语义：激活工具红色高亮 */
  #toolbar .tb.on { background: #e5484d; color: #fff; }
  #toolbar .tb.pri { background: var(--accent); color: #fff; font-weight: 500; }
  #toolbar .tb.pri:hover { background: var(--accent-hover); }
  #toolbar .tb .kbd { font-family: var(--mono); font-size: 9.5px; opacity: 0.75; }
  /* 形状槽位：矩形/椭圆合并按钮，右下角小三角弹出切换菜单 */
  #toolbar .tb.slot .tri {
    position: absolute; right: 3px; bottom: 3px;
    width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid currentColor; opacity: 0.75; /* ▼ 默认朝下；展开（.open）朝上 */
  }
  #toolbar .tb.slot.open .tri { border-top: none; border-bottom: 5px solid currentColor; bottom: 4px; }
  #toolbar .tb.slot .slot-menu {
    display: none; position: absolute; top: 32px; left: 0; z-index: 30;
    background: var(--ov-surface); border: 1px solid var(--ov-border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45); padding: 3px; white-space: nowrap;
  }
  #toolbar .tb.slot .slot-menu.open { display: block; }
  #toolbar .tb.slot .slot-menu button {
    display: flex; align-items: center; gap: 7px; width: 100%;
    border: none; background: transparent; color: var(--ov-fg);
    font-size: 12px; padding: 6px 12px 6px 8px; border-radius: 6px; cursor: pointer; text-align: left;
  }
  #toolbar .tb.slot .slot-menu button:hover { background: rgba(255,255,255,0.09); }
  #toolbar .tb.slot .slot-menu button.on { background: #e5484d; color: #fff; }
  /* 当前颜色 chip（业界同款：色块 + 右下角标） */
  #pr-chip {
    position: relative; width: 22px; height: 22px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.35); cursor: pointer; padding: 0; flex: none;
  }
  #pr-chip::after {
    content: ""; position: absolute; right: -1px; bottom: -1px;
    width: 0; height: 0; border-left: 7px solid transparent; border-bottom: 7px solid rgba(255,255,255,0.9);
    border-radius: 0 0 5px 0;
  }
  /* 文字背景色直达块：与字色 chip 对称，无背景态显示斜纹 */
  #pr-tbgchip {
    width: 22px; height: 22px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,.4); cursor: pointer; padding: 0; flex: none;
  }
  #pr-tbgchip.none { background: repeating-linear-gradient(45deg, #666 0 4px, #333 4px 8px) !important; }
  /* 色板：两行 10 列（画图经典 20 色 = 同类产品 默认板） */
  #pr-color { max-width: 236px; flex-wrap: wrap; }
  #pr-color .sw { width: 15px; height: 15px; border-radius: 3px; }
  /* 线宽滑杆 2–24 */
  #pr-width input[type="range"] { width: 86px; accent-color: #e5484d; }
  #pr-width .wv { font: 10.5px/1.4 var(--mono); color: var(--ov-fg-dim); min-width: 16px; text-align: center; }
  .wvlbl { font-size: 10.5px; color: var(--ov-fg-dim); flex: none; } /* 滑杆可见标签（强度/不透明）——裸滑杆用户认不出 */
  /* 业界同款下拉：按钮=当前态 icon+右下▼（展开▲），浮层=icon+文字选项列表 */
  .ddl { position: relative; display: inline-flex; }
  .ddl-btn { display: inline-flex; align-items: center; gap: 2px; min-width: 34px; height: 30px;
    border: none; background: transparent; color: var(--ov-fg); border-radius: 6px; cursor: pointer; padding: 0 5px; }
  .ddl-btn:hover { background: rgba(255, 255, 255, 0.09); }
  .ddl-cur svg { display: block; }
  .ddl-tri { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 4.5px solid currentColor; opacity: 0.75; align-self: center; margin: 0 0 0 2px; } /* ▼ 垂直居中 */
  .ddl.open .ddl-tri { border-top: none; border-bottom: 4.5px solid currentColor; margin: 0 0 0 2px; align-self: center; } /* ▲ 垂直居中 */
  .ddl-menu { display: none; position: absolute; top: 32px; left: 0; z-index: 40;
    background: var(--ov-surface); border: 1px solid var(--ov-border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); padding: 3px; flex-direction: column; min-width: 118px; }
  .ddl.open .ddl-menu { display: flex; }
  .ddl-item { display: flex; align-items: center; gap: 7px; width: 100%; border: none; background: transparent;
    color: var(--ov-fg); font-size: 12px; padding: 6px 12px 6px 8px; border-radius: 6px; cursor: pointer;
    text-align: left; white-space: nowrap; }
  .ddl-item:hover { background: rgba(255, 255, 255, 0.09); }
  .ddl-item.on { background: #e5484d; color: #fff; }
  #toolbar .sep { width: 1px; height: 18px; background: var(--ov-border); margin: 0 3px; }
  #toolbar .sw {
    width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; padding: 0;
  }
  #toolbar .sw.on { border-color: #fff; }
  #toolbar .sw.custom {
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    color: #fff; font-size: 11px; line-height: 1;
  }
  #toolbar .sw.custom.on { border-color: #fff; }
  #pr-hex {
    width: 74px; height: 22px; font: 11px/1.4 var(--mono);
    background: var(--ov-surface-2); color: var(--ov-fg);
    border: 1px solid var(--ov-border); border-radius: 5px; padding: 0 6px;
    display: none;
  }
  #pr-text select {
    height: 22px; font-size: 11px; background: var(--ov-surface-2);
    color: var(--ov-fg); border: 1px solid var(--ov-border); border-radius: 5px;
  }
  #pr-num-start { font-size: 11px; color: var(--ov-fg-dim); }
  #pr-num-start input {
    width: 44px; height: 22px; font: 11px/1.4 var(--mono);
    background: var(--ov-surface-2); color: var(--ov-fg);
    border: 1px solid var(--ov-border); border-radius: 5px; padding: 0 4px;
  }
  #toolbar .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ov-fg); border: none; cursor: pointer; padding: 0; }
  #toolbar .dot.on { background: var(--accent); }
  #toolbar .seg { display: inline-flex; }
  #toolbar .seg button {
    font-family: inherit; font-size: 11px; padding: 4px 9px; cursor: pointer;
    background: var(--ov-surface-2); border: 1px solid var(--ov-border); color: #cfcfd6;
  }
  #toolbar .seg button + button { border-left: none; }
  #toolbar .seg button:first-child { border-radius: 6px 0 0 6px; }
  #toolbar .seg button:last-child { border-radius: 0 6px 6px 0; }
  #toolbar .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #toolbar .props { display: none; align-items: center; gap: 6px; padding: 2px 6px; color: var(--ov-fg-dim); font-size: 11px; }
  #toolbar .props.on { display: inline-flex; }
  #toolbar .tip { color: var(--ov-fg-dim); font-size: 11px; padding: 0 4px; }

  /* 画图层（选区内标注对象） */
  #layer { position: absolute; display: none; z-index: 5; pointer-events: none; }
  #layer .obj { position: absolute; pointer-events: none; white-space: pre; } /* 文字只认 \n 换行，与引擎渲染一致 */
  /* 无工具悬浮标注：虚线轮廓预览（可点选/双击文字再编辑） */
  #layer .obj-hover { outline: 2px dashed rgba(77, 163, 255, 0.9); outline-offset: 3px; }
  #layer.tool-eraser .obj { pointer-events: auto; cursor: pointer; }
  #layer.tool-eraser .obj:hover { filter: brightness(1.25) drop-shadow(0 0 3px rgba(255,255,255,0.8)); }
  /* 选择工具：对象选中框（虚线 + 8 手柄），可整框拖动 */
  #objsel {
    position: absolute; display: none; z-index: 6;
    border: 1.5px dashed #4da3ff; pointer-events: none;
  }
  #objsel .h {
    position: absolute; width: 10px; height: 10px; box-sizing: border-box;
    background: #fff; border: 1.5px solid #4da3ff; border-radius: 1px;
    pointer-events: auto; display: none;
  }
  #objsel .h::after { content: ""; position: absolute; inset: -5px; }
  #objsel.resizable .h { display: block; }
  #objsel .h.nw { left: -5px; top: -5px; cursor: nwse-resize; }
  #objsel .h.ne { right: -5px; top: -5px; cursor: nesw-resize; }
  #objsel .h.sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
  #objsel .h.se { right: -5px; bottom: -5px; cursor: nwse-resize; }
  #objsel .h.n { left: 50%; top: -5px; margin-left: -5px; cursor: ns-resize; }
  #objsel .h.s { left: 50%; bottom: -5px; margin-left: -5px; cursor: ns-resize; }
  #objsel .h.w { left: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }
  #objsel .h.e { right: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }
  /* 箭头端点锚点：挂 body、直接钉在端点视口坐标（拖动改方向和长度） */
  .e-dot {
    position: absolute; width: 10px; height: 10px; box-sizing: border-box;
    background: #fff; border: 1.5px solid #4da3ff; border-radius: 1px;
    pointer-events: auto; display: none; cursor: move; z-index: 7;
  }
  .e-dot::after { content: ""; position: absolute; inset: -5px; }
  /* 旋转锚 ◎：形状类标注选中时显示在对象上方，拖动绕中心旋转 */
  .rot-anc {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid #4da3ff;
    display: none; cursor: grab; z-index: 7; pointer-events: auto;
  }
  .rot-anc::after { content: ""; position: absolute; inset: -7px; }
  /* 旋转标注预览 */
  #layer .obj { transform-origin: center; }
  /* 选中箭头本体辉光：归属一目了然 */
  .obj-sel-glow svg { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 2px rgba(255, 255, 255, 0.85)); }
  /* 同类产品 图5：箭头选中只有两端锚点，无包围框 */
  #objsel.arrow-mode { border-color: transparent; }
  /* 业界同款方形小手柄 → 圆形蓝点锚点（4 角 + 4 边中点） */
  .txtedit {
    position: absolute; z-index: 40; min-width: 40px;
    outline: 2px solid var(--accent); background: rgba(0,0,0,0.24);
    color: #fff; padding: 0.25em; border-radius: 4px;
    font-weight: 500; white-space: pre; cursor: text;
    transform-origin: center;
  }
  /* 确认后的文字对象：背景呼吸内边距与引擎 pad（字号 25%）一致 */
  #layer .obj[data-k="text"] { padding: 0.25em; }
  /* 文字编辑态四角拉伸手柄（点击开始输入即刻显示，同类产品 同款） */
  .t-anc {
    position: absolute; width: 12px; height: 12px;
    background: #fff; border: 1.5px solid #4da3ff; border-radius: 3px;
    pointer-events: auto; display: none; z-index: 41;
  }
  .t-anc::after { content: ""; position: absolute; inset: -5px; }
  .t-anc-nw, .t-anc-se { cursor: nwse-resize; }
  .t-anc-ne, .t-anc-sw { cursor: nesw-resize; }
  /* 通用弹层面板（A 文字设置 / 色板）：图标化收纳，低频设置不占行宽 */
  .flymenu {
    position: fixed; display: none; width: 236px;
    padding: 10px; background: var(--ov-surface); border: 1px solid var(--ov-border);
    border-radius: 10px; z-index: 90; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    color: var(--ov-fg); font-size: 11px;
  }
  .flymenu .row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .flymenu .row:last-child { margin-bottom: 0; }
  .flymenu .lbl { width: 34px; color: var(--ov-fg-dim); flex: none; }
  .flymenu .sws { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
  .flymenu .sw { width: 26px; height: 26px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; padding: 0; flex: none; position: relative; }
  .flymenu .sw::after { content: ""; position: absolute; inset: -4px; } /* 扩热区：22px 色块易点空 */
  .flymenu .sw.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .flymenu .sw.none { background: repeating-linear-gradient(45deg, #666 0 4px, #333 4px 8px); }
  .flymenu input[type="range"] { flex: 1; accent-color: var(--accent); height: 18px; }
  .flymenu .val { width: 30px; text-align: right; color: var(--ov-fg-dim); flex: none; }
  .flymenu input[type="color"] { width: 40px; height: 22px; border: 1px solid var(--ov-border); border-radius: 4px; background: none; padding: 0; cursor: pointer; }
  .flymenu select { background: var(--ov-surface-2); color: var(--ov-fg); border: 1px solid var(--ov-border); border-radius: 4px; font-size: 11px; padding: 2px 4px; }
  .flymenu .sect { border-top: 1px solid var(--ov-border); margin: 8px -10px 8px; padding-top: 8px; }
  .flymenu .sect:first-child { display: none; }
  }
  .ann-toast {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ov-surface); color: var(--ov-fg); font-size: 12px;
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--ov-border);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4); z-index: 95;
  }
</style>
</head>
<body data-kind="region">
  <img id="freeze" alt="">
  <div id="stage" class="dim-idle cross"></div>
  <div id="det"><span class="tag"></span></div>
  <div id="sel" class="hole">
    <div class="handle nw"></div><div class="handle n"></div><div class="handle ne"></div>
    <div class="handle w"></div><div class="handle e"></div>

  </div>
  <style>
    #escdlg { position: fixed; inset: 0; display: none; z-index: 200; background: rgba(0,0,0,0.35); }
    #escdlg.open { display: flex; align-items: center; justify-content: center; }
    #escdlg .dlg-card {
      background: var(--ov-surface); color: var(--ov-fg);
      border: 1px solid var(--ov-border); border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.55); padding: 18px 20px; min-width: 300px;
    }
    #escdlg .dlg-title { font-size: 13.5px; margin-bottom: 14px; }
    #escdlg .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; }
    #escdlg .dlg-btns button {
      font-family: inherit; font-size: 12px; padding: 6px 16px; cursor: pointer;
      border: 1px solid var(--ov-border); border-radius: 7px;
      background: var(--ov-surface-2); color: var(--ov-fg);
    }
    #escdlg .dlg-btns button:hover { border-color: var(--accent); }
    #escdlg .dlg-btns button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
    #escdlg .dlg-remember {
      display: flex; align-items: center; gap: 7px; margin-top: 12px;
      color: var(--ov-fg-dim); font-size: 11.5px; cursor: pointer;
    }
  </style>

  <!-- 右键菜单：输出选项（阴影/边框 = 同类产品 标志性出图效果） -->
  <div id="ctxmenu">
    <div class="ctx-title">输出选项</div>
    <label class="ctx-row"><input type="checkbox" id="opt-shadow"/>阴影</label>
    <div class="ctx-sub">模糊 <input type="range" id="opt-shadow-blur" min="4" max="60" step="2" value="24"/> <span id="opt-shadow-blur-v">24</span></div>
    <div class="ctx-sub">颜色 <button class="ctx-sw" id="opt-shadow-color" data-c="#000000"></button></div>
    <label class="ctx-row"><input type="checkbox" id="opt-border"/>边框</label>
    <div class="ctx-sub">宽度 <input type="range" id="opt-border-w" min="1" max="20" step="1" value="6"/> <span id="opt-border-w-v">6</span></div>
    <div class="ctx-sub">颜色 <button class="ctx-sw" id="opt-border-color" data-c="#FFFFFF"></button></div>
  </div>
  <style>
    #ctxmenu {
      position: absolute; display: none; z-index: 150; width: 200px;
      background: var(--ov-surface); color: var(--ov-fg);
      border: 1px solid var(--ov-border); border-radius: 10px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5); padding: 8px 12px;
      font-size: 12px;
    }
    #ctxmenu .ctx-title { color: var(--ov-fg-dim); font-size: 11px; margin-bottom: 6px; }
    #ctxmenu .ctx-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
    #ctxmenu .ctx-sub { display: flex; align-items: center; gap: 6px; padding: 1px 0 3px 24px; color: var(--ov-fg-dim); }
    #ctxmenu .ctx-sub input[type="range"] { width: 90px; accent-color: var(--accent); }
    #ctxmenu .ctx-sw {
      width: 16px; height: 16px; border-radius: 4px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.4); padding: 0;
    }
  </style>
  <style>
    #cancel-x {
      font-family: inherit; font-size: 11px; line-height: 1.5;
      margin-left: 10px; padding: 1px 10px;
      border: 1px solid var(--ov-border); border-radius: 6px;
      background: var(--ov-surface-2); color: var(--ov-fg);
      cursor: pointer;
    }
    #cancel-x:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
  <script src="js/overlay.js"></script>
  <script src="js/annotate.js"></script>
</body>
</html>
